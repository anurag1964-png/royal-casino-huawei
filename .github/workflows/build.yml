name: Build Signed Huawei Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Verify Existing Keystore & SHA-256
        run: |
          keytool -list -v -keystore release.jks -alias royalcasino -storepass RoyalCasino2026 | grep "SHA256:" > sha256.txt
          echo "### Your Huawei SHA-256 Certificate Fingerprint" >> $GITHUB_STEP_SUMMARY
          cat sha256.txt >> $GITHUB_STEP_SUMMARY

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/playzone/royalcasino/hw
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp index.html app/src/main/assets/index.html
          cp agconnect-services.json app/agconnect-services.json
          cp release.jks app/release.jks

          cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url 'https://developer.huawei.com/repo/' }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://developer.huawei.com/repo/' }
              }
          }
          rootProject.name = "Royal3CardCasino"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://developer.huawei.com/repo/' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'com.huawei.agconnect:agcp:1.9.1.301'
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'com.huawei.agconnect'
          }

          android {
              namespace 'com.playzone.royalcasino.hw'
              compileSdk 34

              defaultConfig {
                  applicationId "com.playzone.royalcasino.hw"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }

              signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword "RoyalCasino2026"
                      keyAlias "royalcasino"
                      keyPassword "RoyalCasino2026"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.huawei.hms:iap:6.13.0.300'
              implementation 'com.unity3d.ads:unity-ads:4.12.2'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Royal 3-Card Casino 3D</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/playzone/royalcasino/hw/MainActivity.java
          package com.playzone.royalcasino.hw;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.IntentSender;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          import com.huawei.hmf.tasks.Task;
          import com.huawei.hms.iap.Iap;
          import com.huawei.hms.iap.IapApiException;
          import com.huawei.hms.iap.entity.ConsumeOwnedPurchaseReq;
          import com.huawei.hms.iap.entity.InAppPurchaseData;
          import com.huawei.hms.iap.entity.OrderStatusCode;
          import com.huawei.hms.iap.entity.PurchaseIntentReq;
          import com.huawei.hms.iap.entity.PurchaseIntentResult;
          import com.huawei.hms.iap.entity.PurchaseResultInfo;
          import com.huawei.hms.support.api.client.Status;

          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final int REQ_CODE_BUY = 6666;
              private static final int REQ_CODE_RESOLVE = 6667;
              private static final String UNITY_GAME_ID = "800438848";
              private static final String UNITY_PLACEMENT_ID = "BP_Rewarded_Android";
              private boolean isAdLoaded = false;
              private String pendingSku = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new HuaweiIAPBridge(), "HuaweiIAPBridge");
                  webView.addJavascriptInterface(new UnityAdsBridge(), "UnityAdsBridge");
                  webView.loadUrl("file:///android_asset/index.html");

                  initUnityAds();
              }

              private void initUnityAds() {
                  UnityAds.initialize(getApplicationContext(), UNITY_GAME_ID, false, new IUnityAdsInitializationListener() {
                      @Override
                      public void onInitializationComplete() {
                          loadRewardedAd();
                      }
                      @Override
                      public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {
                          isAdLoaded = false;
                      }
                  });
              }

              private void loadRewardedAd() {
                  UnityAds.load(UNITY_PLACEMENT_ID, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {
                          isAdLoaded = true;
                      }
                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                          isAdLoaded = false;
                      }
                  });
              }

              private void callJS(final String js) {
                  runOnUiThread(() -> webView.evaluateJavascript(js, null));
              }

              private void startHuaweiPurchase(final String sku) {
                  runOnUiThread(() -> {
                      pendingSku = sku;
                      PurchaseIntentReq req = new PurchaseIntentReq();
                      req.setProductId(sku);
                      req.setPriceType(0);
                      Task<PurchaseIntentResult> task = Iap.getIapClient(MainActivity.this).createPurchaseIntent(req);
                      task.addOnSuccessListener(result -> {
                          Status status = result.getStatus();
                          if (status != null && status.hasResolution()) {
                              try {
                                  status.startResolutionForResult(MainActivity.this, REQ_CODE_BUY);
                              } catch (IntentSender.SendIntentException e) {
                                  callJS("window.onHuaweiPurchaseFailure && window.onHuaweiPurchaseFailure(-1, 'Payment screen error');");
                              }
                          }
                      }).addOnFailureListener(e -> {
                          if (e instanceof IapApiException) {
                              IapApiException apiException = (IapApiException) e;
                              Status status = apiException.getStatus();
                              if (status != null && status.hasResolution()) {
                                  try {
                                      status.startResolutionForResult(MainActivity.this, REQ_CODE_RESOLVE);
                                      return;
                                  } catch (IntentSender.SendIntentException ex) {
                                      // Fall through to error callback
                                  }
                              }
                              int code = apiException.getStatusCode();
                              callJS("window.onHuaweiPurchaseFailure && window.onHuaweiPurchaseFailure(" + code + ", 'Huawei IAP Error: " + code + "');");
                          } else {
                              callJS("window.onHuaweiPurchaseFailure && window.onHuaweiPurchaseFailure(-1, 'Huawei IAP unavailable');");
                          }
                      });
                  });
              }

              public class UnityAdsBridge {
                  @JavascriptInterface
                  public void showRewardedAd() {
                      runOnUiThread(() -> {
                          if (!isAdLoaded) {
                              loadRewardedAd();
                              callJS("window.onUnityAdFailed && window.onUnityAdFailed('Video ad is loading, please try again in a few seconds.');");
                              return;
                          }
                          UnityAds.show(MainActivity.this, UNITY_PLACEMENT_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                              @Override
                              public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                  isAdLoaded = false;
                                  loadRewardedAd();
                                  callJS("window.onUnityAdFailed && window.onUnityAdFailed('Video ad failed to play.');");
                              }
                              @Override
                              public void onUnityAdsShowStart(String placementId) {}
                              @Override
                              public void onUnityAdsShowClick(String placementId) {}
                              @Override
                              public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                  isAdLoaded = false;
                                  loadRewardedAd();
                                  if (state == UnityAds.UnityAdsShowCompletionState.COMPLETED) {
                                      callJS("window.onUnityAdRewarded && window.onUnityAdRewarded();");
                                  }
                              }
                          });
                      });
                  }
              }

              public class HuaweiIAPBridge {
                  @JavascriptInterface
                  public void initIAP() {
                      Iap.getIapClient(MainActivity.this).isEnvReady();
                  }

                  @JavascriptInterface
                  public void createPurchaseIntent(String sku) {
                      startHuaweiPurchase(sku);
                  }

                  @JavascriptInterface
                  public void consumePurchase(String purchaseToken) {
                      if (purchaseToken == null || purchaseToken.isEmpty()) return;
                      ConsumeOwnedPurchaseReq req = new ConsumeOwnedPurchaseReq();
                      req.setPurchaseToken(purchaseToken);
                      Iap.getIapClient(MainActivity.this).consumeOwnedPurchase(req);
                  }

                  @JavascriptInterface
                  public void exitApp() {
                      runOnUiThread(() -> finishAffinity());
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_CODE_RESOLVE) {
                      if (resultCode == Activity.RESULT_OK && pendingSku != null) {
                          String retrySku = pendingSku;
                          pendingSku = null;
                          startHuaweiPurchase(retrySku);
                      } else {
                          pendingSku = null;
                          callJS("window.onHuaweiPurchaseFailure && window.onHuaweiPurchaseFailure(-1, 'Cancelled');");
                      }
                      return;
                  }
                  if (requestCode == REQ_CODE_BUY) {
                      pendingSku = null;
                      if (data == null) {
                          callJS("window.onHuaweiPurchaseFailure && window.onHuaweiPurchaseFailure(-1, 'Cancelled');");
                          return;
                      }
                      PurchaseResultInfo info = Iap.getIapClient(this).parsePurchaseResultInfoFromIntent(data);
                      if (info.getReturnCode() == OrderStatusCode.ORDER_STATE_SUCCESS) {
                          try {
                              InAppPurchaseData pd = new InAppPurchaseData(info.getInAppPurchaseData());
                              String sku = pd.getProductId();
                              String token = pd.getPurchaseToken();
                              callJS("window.onHuaweiPurchaseSuccess && window.onHuaweiPurchaseSuccess('" + sku + "', '" + token + "');");
                          } catch (Exception e) {
                              callJS("window.onHuaweiPurchaseFailure && window.onHuaweiPurchaseFailure(-2, 'Receipt error');");
                          }
                      } else {
                          callJS("window.onHuaweiPurchaseFailure && window.onHuaweiPurchaseFailure(" + info.getReturnCode() + ", 'Cancelled');");
                      }
                  }
              }
          }
          EOF

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK & SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Royal-3Card-Casino-Huawei-Release-v1.3
          path: |
            app/build/outputs/apk/release/app-release.apk
            sha256.txt
